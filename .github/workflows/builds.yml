name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: juiced-editor-windows
            artifact_path: juiced-editor-windows.zip
          - os: macos-latest
            artifact_name: juiced-editor-macos
            artifact_path: juiced-editor-macos.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/juiced_editor.exe dist/
          Copy-Item assets dist/assets -Recurse
          Compress-Archive -Path dist/* -DestinationPath juiced-editor-windows.zip

      - name: Configure and Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp build/juiced_editor dist/
          cp -R assets dist/assets
          chmod +x dist/juiced_editor
          cd dist && zip -r ../juiced-editor-macos.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/juiced-editor-windows/juiced-editor-windows.zip
            artifacts/juiced-editor-macos/juiced-editor-macos.zip
