name: Build and Release

on:
  push:
    branches: [ main, master ]
  tags:
    - 'v*' # v1.0.0などのタグがプッシュされた時にもトリガーする場合
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: juiced-editor-windows
            artifact_path: build/Release/juiced_editor.exe
          - os: macos-latest
            artifact_name: juiced-editor-macos
            artifact_path: build/juiced_editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. macOSの依存関係インストール (Homebrew)
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sfml

      # 1. Windows用のSFML（プレビルド版）を直接ダウンロード・展開
      - name: Download SFML (Windows)
        if: runner.os == 'Windows'
        run: |
          $sfmlUrl = "https://www.sfml-dev.org/files/SFML-3.0.0-windows-vc17-64-bit.zip"
          Invoke-WebRequest -Uri $sfmlUrl -OutFile "sfml.zip"
          Expand-Archive -Path "sfml.zip" -DestinationPath "."
          $extractedDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "SFML-*" }
          Rename-Item -Path $extractedDir.Name -NewName "SFML"

      # 2. CMakeの構成とビルド (Windows)
      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . -DSFML_DIR="${{ github.workspace }}/SFML/lib/cmake/SFML"
          cmake --build build --config Release

      # 2. CMakeの構成とビルド (macOS)
      - name: Configure and Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -S .
          cmake --build build --config Release

      # 3. 成果物をGitHub Actions内部に保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # タグプッシュ時のみ実行
    steps:
      # ビルドされた両方の成果物をダウンロード
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # GitHub Releasesへ両方のファイルを同時にアップロード
      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/juiced-editor-windows/juiced_editor.exe
            artifacts/juiced-editor-macos/juiced_editor
