name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: juiced-editor-windows
            artifact_path: build/Release/juiced_editor.exe
          - os: macos-latest
            artifact_name: juiced-editor-macos
            artifact_path: build/juiced_editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sfml

      - name: Download SFML (Windows)
        if: runner.os == 'Windows'
        run: |
          $sfmlUrl = "https://www.sfml-dev.org/files/SFML-3.0.0-windows-vc17-64-bit.zip"
          Invoke-WebRequest -Uri $sfmlUrl -OutFile "sfml.zip"
          Expand-Archive -Path "sfml.zip" -DestinationPath "."
          $extractedDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "SFML-*" }
          Rename-Item -Path $extractedDir.Name -NewName "SFML"

      - name: Configure and Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -S . -DSFML_DIR="${{ github.workspace }}/SFML/lib/cmake/SFML"
          cmake --build build --config Release

      - name: Configure and Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -S .
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/juiced-editor-windows/juiced_editor.exe -> juiced-editor-windows.exe
            artifacts/juiced-editor-macos/juiced_editor -> juiced-editor-macos
